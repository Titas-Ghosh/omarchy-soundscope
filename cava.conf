# Soundscope's private cava config. Raw ASCII frames on stdout, one per line:
# 48 values (0-1000) separated by ';'. Stereo mode mirrors the channels so the
# bass sits in the middle, left channel on the left half, right on the right.

[general]
framerate = 60
bars = 48
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 70
